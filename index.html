<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>受験票ジェネレーター</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--fg:#1f2937;--mut:#6b7280;--bd:#d1d5db;--ac:#1d4ed8;--acfg:#fff;--inp:#fff;--pv:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--fg:#e5e7eb;--mut:#9ca3af;--bd:#374151;--ac:#3b82f6;--inp:#111827;--pv:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
.app{display:flex;flex-direction:column;min-height:100vh}
#editor,#pane{min-width:0}
#editor{padding:12px 16px;background:var(--panel)}
#pane{padding:12px 16px;background:var(--pv)}
@media(min-width:1024px){
.app{flex-direction:row;height:100vh;overflow:hidden}
#editor{width:440px;flex:none;overflow-y:auto;border-right:1px solid var(--bd)}
#pane{flex:1;overflow-y:auto}}
h1{font-size:16px;margin:0 0 8px}
details{border:1px solid var(--bd);border-radius:6px;margin-bottom:10px}
summary{cursor:pointer;padding:8px 10px;font-weight:700;background:var(--bg);border-radius:6px}
.sec{padding:10px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px;white-space:nowrap}
input[type=text],input[type=date],input[type=number],input[type=time],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--inp);color:var(--fg);font:inherit}
textarea{resize:vertical}
button{padding:6px 12px;border:1px solid var(--bd);border-radius:4px;background:var(--panel);color:var(--fg);font:inherit;cursor:pointer;white-space:nowrap}
button.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#drop{border:2px dashed var(--bd);border-radius:6px;padding:14px;text-align:center;color:var(--mut)}
#drop.over{border-color:var(--ac);color:var(--ac)}
.note{font-size:11px;color:var(--mut);margin:6px 0}
.map{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;align-items:center;margin-top:8px}
.map span{white-space:nowrap}
#list{max-height:180px;overflow:auto;border:1px solid var(--bd);border-radius:4px;margin-top:8px}
#list label{display:flex;gap:6px;margin:0;padding:2px 8px;font-size:12px;color:var(--fg);align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch{display:grid;grid-template-columns:110px 1fr auto;gap:4px;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:13px;color:var(--fg)}
#bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px}
.pw{position:relative;overflow:hidden;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.pw .ticket{position:absolute;left:0;top:0;transform-origin:0 0}
/* ticket */
.ticket{width:210mm;height:297mm;padding:15mm;background:#fff;color:#000;font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;font-size:10.5pt;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.ticket *{box-sizing:border-box}
.t-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:3.5mm}
.t-head{text-align:center;border-bottom:1.2mm double #000;padding-bottom:3mm}
.t-lab{font-size:13pt;letter-spacing:.6em;white-space:nowrap;font-weight:700}
.t-title{font-size:22pt;font-weight:700;margin-top:1mm;white-space:nowrap;overflow:hidden}
.t-org{font-size:10pt;white-space:nowrap}
.t-box{border:.6mm solid #000;display:flex;min-height:36mm}
.t-box .l{flex:1;min-width:0;display:flex;flex-direction:column}
.t-box .r{width:30mm;margin:2mm;border:.3mm solid #000;display:flex;align-items:center;justify-content:center;font-size:8pt;text-align:center;color:#444;white-space:pre-line}
.t-cell{padding:2mm 4mm;display:flex;align-items:baseline;gap:4mm;min-width:0}
.t-cell+.t-cell{border-top:.3mm solid #000}
.t-k{font-size:9pt;width:20mm;flex:none;white-space:nowrap}
.t-v{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.t-no{font-family:"Consolas","Courier New",monospace;font-size:30pt;font-weight:700;letter-spacing:.1em;line-height:1.2}
.t-name{font-size:24pt;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden}
.t-kana{font-size:8.5pt;display:block;height:4.5mm;white-space:nowrap}
.t-sch{font-size:12pt}
table.t-info{border-collapse:collapse;width:100%}
table.t-info th,table.t-info td{border:.3mm solid #000;padding:1.5mm 3mm;text-align:left;vertical-align:top}
table.t-info th{width:26mm;background:#eee;font-weight:400;white-space:nowrap}
table.t-info td{white-space:pre-line}
.t-h{font-weight:700;font-size:10.5pt;border-left:1.5mm solid #000;padding-left:2mm;margin-bottom:1mm;white-space:nowrap}
.t-list{margin:0;padding-left:5mm;font-size:10pt}
ol.t-list{padding-left:6mm}
.t-foot{margin-top:auto;border-top:.3mm solid #000;padding-top:2mm;font-size:9.5pt;white-space:pre-line}
.t-stub{height:72mm;margin-top:3mm;border-top:.4mm dashed #000;position:relative;padding-top:6mm;display:flex;flex-direction:column;gap:2mm;flex:none}
.t-cut{position:absolute;top:-3.6mm;left:6mm;background:#fff;padding:0 2mm;font-size:12pt;line-height:1}
.t-stub .t-name{font-size:20pt}
.t-stub .t-no{font-size:24pt}
/* template: waseda */
.tw{padding:0;display:block;position:relative;font-family:"Yu Gothic","Meiryo","Hiragino Sans",sans-serif;line-height:1.3}
.tw .w-hd{position:absolute;left:8mm;top:6.5mm;display:flex;align-items:center;gap:6mm;white-space:nowrap}
.tw .w-hd-t{font-size:13pt}
.tw .w-badge{background:#C00000;color:#fff;font-size:13pt;height:8.6mm;line-height:8.6mm;padding:0 4.5mm}
.tw .w-mark{position:absolute;right:19mm;top:4mm;font-size:38pt;font-weight:700;letter-spacing:.25em;margin-right:-.25em;line-height:1.2;white-space:nowrap}
.tw .w-tbl{position:absolute;left:19.5mm;top:22.3mm;width:171mm;border:1.5pt solid #C00000;border-bottom:0}
.tw .w-row{display:flex;border-bottom:1.5pt solid #C00000}
.tw .w-c{position:relative;flex:1;min-width:0;height:100%}
.tw .w-c+.w-c{border-left:1.5pt solid #C00000}
.tw .w-l{position:absolute;left:2mm;top:1mm;font-size:10pt;white-space:nowrap}
.tw .w-v{position:absolute;left:3mm;right:3mm;top:0;bottom:0;padding-top:5.5mm;white-space:nowrap;overflow:hidden;text-align:center;font-size:26pt;line-height:1.25}
.tw .wide .w-l{top:50%;transform:translateY(-50%)}
.tw .wide .w-v{left:25mm;text-align:left;padding-top:0;font-size:28pt}
.tw .w-no{font-size:30pt}
.tw .w-red{color:#C00000;font-weight:700;font-size:30pt}
.tw .w-sub{font-size:.4em;line-height:1.1}
.tw .w-sch{display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.tw .w-sch div{white-space:nowrap}
.tw .w-sch b{display:inline-block;width:15mm;font-weight:400}
.tw .w-sch i{font-style:normal;letter-spacing:.22em}
.tw .w-fold{position:absolute;left:0;top:148.5mm;width:210mm;height:0;display:flex;align-items:center;gap:5mm;font-size:13pt;white-space:nowrap}
.tw .w-fold span{display:block;flex:1;border-top:1.2pt dashed #000;height:0}
.tw .w-fold em{font-style:normal;flex:none}
.tw .w-lo{position:absolute;left:20mm;top:158.5mm;width:85mm}
.tw .w-nh{display:inline-block;background:#C00000;color:#fff;font-size:13pt;padding:1mm 3.5mm;margin-bottom:4mm}
.tw .w-n{font-size:11.5pt;line-height:1.4;padding-left:1.3em;text-indent:-1.3em;margin:0 0 .5mm 1mm;line-break:strict}
.tw .w-n.r{color:#C00000}
.tw .w-ri{position:absolute;left:115mm;top:160mm;width:78mm}
.tw .w-ri img{display:block;width:100%;height:auto}
.tw .w-ri img+img{margin-top:5mm}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.img-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.img-f img{max-height:44px;max-width:80px;border:1px solid var(--bd);background:#fff}
@media print{
html,body{background:#fff}
#editor,#bar,.noprint{display:none!important}
.app,#pane{display:block;height:auto;overflow:visible;padding:0;background:#fff}
#pages{display:block}
.pw{width:210mm!important;height:297mm!important;box-shadow:none;overflow:hidden;page-break-after:always;break-after:page}
.pw .ticket{position:static;transform:none!important}
@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="app">
<div id="editor">
<h1>受験票ジェネレーター</h1>
<details open><summary>1. デザイン</summary><div class="sec">
<label for="tpl">デザイン（テンプレート）</label><select id="tpl"></select>
<label for="pre">保存済みデザイン</label><select id="pre"></select>
<div class="pgrid"><button id="psave" type="button">デザインを保存</button><button id="pover" type="button">上書き保存</button><button id="pren" type="button">名前を変更</button><button id="pdel" type="button">削除</button></div>
<p class="note">※現在のデザインと共通設定を名前を付けて保存できます（このブラウザ内のみ）。</p>
</div></details>
<details open><summary>2. 名簿読み込み</summary><div class="sec">
<div id="drop">ここにCSV / Excelをドロップ<br><button id="fbtn" type="button">ファイルを選択</button><input id="file" type="file" accept=".csv,.xlsx,.xls" hidden></div>
<label for="paste">貼り付け（Excelからコピーしたタブ区切り・1行目は見出し）</label>
<textarea id="paste" rows="3"></textarea>
<div class="row" style="margin-top:6px"><button id="pbtn" type="button">貼り付けを読み込む</button><button id="sample" type="button">サンプルCSVをダウンロード</button></div>
<p class="note">※名簿（個人情報）は保存されません。ページを閉じる・再読込で消えます。</p>
<div id="loaded" hidden>
<div id="cnt" style="font-weight:700"></div>
<div class="map" id="map"></div>
<div id="auto" class="grid3" hidden>
<div><label>受験番号 接頭辞</label><input type="text" id="apre"></div>
<div><label>開始番号</label><input type="number" id="astart" value="1" min="0"></div>
<div><label>桁数</label><input type="number" id="adig" value="3" min="1" max="10"></div></div>
<div class="row" style="margin-top:8px"><button id="sall" type="button">全選択</button><button id="snone" type="button">全解除</button><span id="selcnt" class="note"></span></div>
<div id="list"></div>
</div></div></details>
<details open><summary>3. 試験情報</summary><div class="sec" id="fields"></div></details>
</div>
<div id="pane">
<div id="bar"><span id="pcount"></span><span class="row"><button class="pri" id="print" type="button">印刷 / PDF保存</button></span></div>
<div id="pages"></div>
</div>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lines(s){return (s||'').split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean)}
function fmtDate(s){if(!s)return '';var m=/^(\d+)-(\d+)-(\d+)$/.exec(s);if(!m)return s;
var d=new Date(+m[1],+m[2]-1,+m[3]);return m[1]+'年'+(+m[2])+'月'+(+m[3])+'日（'+'日月火水木金土'[d.getDay()]+'）'}
function fit(e,min){var fs=parseFloat(getComputedStyle(e).fontSize),g=0;
e.style.fontSize=fs+'px';while(e.scrollWidth>e.clientWidth+0.5&&fs>(min||6)&&g++<200){fs-=0.5;e.style.fontSize=fs+'px'}}

/* ---------- 名簿の項目定義（key,ラベル,見出し候補） ---------- */
var SF={
name:['氏名','氏名',['氏名','名前','生徒名','name','お名前']],
kana:['ふりがな／カナ氏名','',['カナ氏名','カナ','フリガナ','ふりがな','よみ','読み','ヨミ']],
no:['受験番号','',['受験番号','番号','id','生徒番号','no','no.']],
school:['学校名','',['学校名','学校','高校','在籍校']],
grade:['学年','',['学年名','学年']],
faculty:['志望学部','',['志望学部','学部','志望']],
room:['教室','',['教室','会場','部屋']],
note:['備考','',['備考','メモ']]};
var SF_ORDER=['name','kana','no','school','grade','faculty','room','note'];

/* ---------- テンプレート ---------- */
var SCH_W=[{t:'10:00〜11:30',c:'英語'},{t:'13:00〜14:30',c:'国語'},{t:'15:30〜16:30',c:'社会'}];
var NOTES_W='!こちらの受験票を折って試験当日に持参してください。\n入場の際、受験票の提示が必要です。\n!試験教室は8:30から開いています。試験時間の30分前までに試験教室に入場してください。\n試験教室の座席に着席する際に、机に貼られている受験番号と一致していることを確認してください。\n受験票は試験時間中机上に置きますので、何も書き込まないでください。（書き込みを発見した場合、不正行為となる可能性があります。）\n受験票は入学後の学生証交付の際に必要になりますので、大切に保管してください。';
var TEMPLATES={};var TPL_ORDER=[];
function addTemplate(t){TEMPLATES[t.id]=t;TPL_ORDER.push(t.id)}

/* シンプル */
function renderSimple(st,V){var t=el('div','ticket'),fits=[];var m=el('div','t-main');
function cell(k,v,cls){var c=el('div','t-cell');c.appendChild(el('div','t-k',k));var d=el('div','t-v '+(cls||''));if(v instanceof Node)d.appendChild(v);else d.textContent=v;c.appendChild(d);return c}
var h=el('div','t-head');h.appendChild(el('div','t-lab','受験票'));
var ti=el('div','t-title',V.title||'');h.appendChild(ti);fits.push(ti);
if(V.school)h.appendChild(el('div','t-org',V.school));m.appendChild(h);
var box=el('div','t-box'),l=el('div','l');
l.appendChild(cell('受験番号',st.no,'t-no'));
var nm=el('div');nm.appendChild(el('span','t-kana',st.kana||''));var nn=el('div','t-name',st.name);nm.appendChild(nn);
l.appendChild(cell('氏名',nm,''));fits.push(nn);
var sg=[st.school,st.grade].filter(Boolean).join('　');
if(sg){var c3=cell('学校・学年',sg,'t-sch');l.appendChild(c3);fits.push(c3.lastChild)}
box.appendChild(l);
if(V.photo)box.appendChild(el('div','r','写真\n（縦4cm×横3cm）'));
m.appendChild(box);
var tb=el('table','t-info');
function tr(k,v){var r=document.createElement('tr');r.appendChild(el('th',null,k));r.appendChild(el('td',null,v));tb.appendChild(r)}
if(V.date)tr('実施日',fmtDate(V.date));if(V.time)tr('集合時刻',V.time);if(V.place)tr('会場',V.place);
if(tb.rows.length)m.appendChild(tb);
var sr=V.sched.filter(function(r){return r.t||r.c});
if(sr.length){var w=el('div');w.appendChild(el('div','t-h','時間割'));var t2=el('table','t-info');
sr.forEach(function(r){var x=document.createElement('tr');x.appendChild(el('th',null,r.t));x.appendChild(el('td',null,r.c));t2.appendChild(x)});
t2.querySelectorAll('th').forEach(function(th){th.style.width='42mm'});w.appendChild(t2);m.appendChild(w)}
var it=lines(V.items);if(it.length){var w2=el('div');w2.appendChild(el('div','t-h','持ち物'));var u=el('ul','t-list');it.forEach(function(x){u.appendChild(el('li',null,x))});w2.appendChild(u);m.appendChild(w2)}
var nt=lines(V.notes);if(nt.length){var w3=el('div');w3.appendChild(el('div','t-h','注意事項'));var o=el('ol','t-list');nt.forEach(function(x){o.appendChild(el('li',null,x))});w3.appendChild(o);m.appendChild(w3)}
if(V.contact)m.appendChild(el('div','t-foot','お問い合わせ：'+V.contact));
t.appendChild(m);
if(V.stub){var sb=el('div','t-stub');sb.appendChild(el('div','t-cut','✂'));
var a=el('div','t-lab','受験票（控え）');a.style.textAlign='left';a.style.letterSpacing='.3em';sb.appendChild(a);
var s1=el('div','t-cell');s1.appendChild(el('div','t-k','受験番号'));s1.appendChild(el('div','t-v t-no',st.no));
var s2=el('div','t-cell');s2.appendChild(el('div','t-k','氏名'));var sn=el('div','t-v t-name',st.name);s2.appendChild(sn);fits.push(sn);
sb.appendChild(s1);sb.appendChild(s2);if(V.title)sb.appendChild(el('div',null,V.title+(V.date?'　'+fmtDate(V.date):'')));t.appendChild(sb)}
t._fits=fits;return t}
addTemplate({id:'simple',name:'シンプル',
fields:[
{k:'school',label:'校舎名・主催（空欄可）',type:'text',def:''},
{k:'title',label:'試験名',type:'text',def:'校内実力テスト'},
{k:'date',label:'実施日',type:'date',def:''},
{k:'time',label:'集合時刻',type:'time',def:'09:00'},
{k:'place',label:'会場（複数行可）',type:'textarea',def:''},
{k:'sched',label:'時間割',type:'sched',def:[{t:'09:00〜10:00',c:'国語'},{t:'10:20〜11:20',c:'数学'}]},
{k:'items',label:'持ち物（1行1項目）',type:'lines',def:'筆記用具\n消しゴム\n時計（通信機能のないもの）'},
{k:'notes',label:'注意事項（1行1項目）',type:'lines',def:'この受験票は試験当日必ず持参してください。\n集合時刻に遅れないように来場してください。\n試験中は携帯電話・スマートフォンの電源を切ってください。'},
{k:'contact',label:'問い合わせ先（1行）',type:'text',def:''},
{k:'photo',label:'写真貼付欄を表示',type:'check',def:false},
{k:'stub',label:'切り取り線＋控え（試験官用）',type:'check',def:false}],
studentFields:['no','name','kana','school','grade','note'],
render:renderSimple});

/* 早大プレ型 */
function imgSrc(v,def){if(!v||v.hide)return '';return v.d||def}
function renderWaseda(st,V){var t=el('div','ticket tw'),fits=[];
var hd=el('div','w-hd');hd.appendChild(el('span','w-hd-t',V.hdr));if(V.badge)hd.appendChild(el('span','w-badge',V.badge));t.appendChild(hd);
if(V.mark)t.appendChild(el('div','w-mark',V.mark));
var tb=el('div','w-tbl');t.appendChild(tb);
function row(h){var r=el('div','w-row');r.style.height=h+'mm';tb.appendChild(r);return r}
function cell(r,cls,label,content,vcls,fitit){var c=el('div','w-c '+(cls||''));c.appendChild(el('div','w-l',label));
var v=el('div','w-v '+(vcls||''));if(content instanceof Node)v.appendChild(content);else v.textContent=content;
c.appendChild(v);r.appendChild(c);if(fitit)fits.push(v);return v}
var r1=row(20.8);cell(r1,'','受験番号',st.no,'w-no',1);cell(r1,'','試験場',V.venue,'w-red',1);
var r2=row(20.8);var kn=el('div');
if(V.showKanji&&st.name&&st.kana){kn.appendChild(el('div','w-sub',st.name));kn.appendChild(el('div',null,st.kana))}else kn.textContent=st.kana||st.name||'';
var kv=cell(r2,'','カナ氏名',kn,'',1);kv.style.letterSpacing='.08em';
var rv=cell(r2,'','教室',st.room||V.room,'',1);rv.style.letterSpacing='.1em';
function wide(h,label,text){var r=row(h);var v=cell(r,'wide',label,text,'',1);v.style.lineHeight=h+'mm';return v}
wide(18.6,'試験日',fmtDate(V.date)).style.letterSpacing='.2em';
wide(17,'入試制度',V.system).style.letterSpacing='.05em';
wide(17.8,'志望学部',st.faculty||V.faculty).style.letterSpacing='.05em';
var r6=row(20.4);var sc=el('div');sc.className='';
var sv=cell(r6,'wide','試験時間','','w-sch');sv.style.fontSize='14pt';sv.style.lineHeight='1.3';
V.sched.filter(function(x){return x.t||x.c}).forEach(function(x){var d=el('div');d.appendChild(el('b',null,x.c));d.appendChild(el('i',null,x.t));sv.appendChild(d)});

/* ---------- 状態・保存 ---------- */
var KEY='juken-hyo-v2',KEY1='juken-hyo-v1',PKEY='juken-hyo-presets-v1';
function mkVals(tpl,saved){var v={};tpl.fields.forEach(function(f){var x=clone(f.def);var s=saved&&saved[f.k];
if(s!==undefined&&s!==null){var ok=f.type==='sched'?Array.isArray(s):f.type==='image'?(typeof s==='object'&&!Array.isArray(s)):f.type==='check'?typeof s==='boolean':typeof s==='string';
if(ok){x=clone(s);if(f.type==='image'){x.d=typeof x.d==='string'?x.d:'';x.hide=!!x.hide}
if(f.type==='sched')x=x.filter(function(r){return r&&typeof r==='object'}).map(function(r){return {t:String(r.t||''),c:String(r.c||'')}})}}
v[f.k]=x});return v}
var S={tpl:'waseda',byTpl:{},cur:''};
try{var raw=localStorage.getItem(KEY);
if(raw){var o0=JSON.parse(raw);if(o0&&typeof o0==='object'){if(TEMPLATES[o0.tpl])S.tpl=o0.tpl;if(o0.byTpl&&typeof o0.byTpl==='object')S.byTpl=o0.byTpl;if(typeof o0.cur==='string')S.cur=o0.cur}}
else{var r1=localStorage.getItem(KEY1);if(r1){var o1=JSON.parse(r1);if(o1&&typeof o1==='object'){S.tpl='simple';S.byTpl.simple=o1}}}}catch(e){}
var V=mkVals(TEMPLATES[S.tpl],S.byTpl[S.tpl]);
var presets=[];
try{var pr=JSON.parse(localStorage.getItem(PKEY)||'[]');if(Array.isArray(pr))presets=pr.filter(function(p){return p&&typeof p.id==='string'&&typeof p.name==='string'&&TEMPLATES[p.tpl]})}catch(e){}
function save(){S.byTpl[S.tpl]=V;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function savePresets(){try{localStorage.setItem(PKEY,JSON.stringify(presets));return true}catch(e){alert('保存できませんでした（保存容量の上限の可能性があります。画像を小さくするか不要な保存済みデザインを削除してください）。');return false}}
function tpl(){return TEMPLATES[S.tpl]}

/* ---------- 共通設定フォーム（テンプレートのfieldsから生成） ---------- */
function resizeImage(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
var sc=Math.min(1,1200/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
var x=c.getContext('2d');var png=/png|gif|svg/.test(file.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
x.drawImage(im,0,0,c.width,c.height);cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88))};
im.onerror=function(){alert('画像を読み込めませんでした。')};im.src=fr.result};fr.readAsDataURL(file)}
function drawFields(){var w=$('fields');w.textContent='';
tpl().fields.forEach(function(f){var k=f.k;
if(f.type==='check'){var lb=el('label','chk');var c=el('input');c.type='checkbox';c.checked=!!V[k];c.onchange=function(){V[k]=c.checked;save();render()};lb.appendChild(c);lb.appendChild(document.createTextNode(f.label));w.appendChild(lb);return}
w.appendChild(el('label',null,f.label));
if(f.type==='sched'){var box=el('div');w.appendChild(box);
var draw=function(){box.textContent='';V[k].forEach(function(r,idx){var d=el('div','sch');var a=el('input');a.type='text';a.value=r.t;a.placeholder='時間';
var b=el('input');b.type='text';b.value=r.c;b.placeholder='科目・内容';var x=el('button',null,'削除');x.type='button';
a.oninput=function(){r.t=a.value;save();render()};b.oninput=function(){r.c=b.value;save();render()};
x.onclick=function(){V[k].splice(idx,1);save();draw();render()};d.appendChild(a);d.appendChild(b);d.appendChild(x);box.appendChild(d)})};
draw();var ad=el('button',null,'＋ 行を追加');ad.type='button';ad.onclick=function(){V[k].push({t:'',c:''});save();draw();render()};w.appendChild(ad);return}
if(f.type==='image'){var d2=el('div','img-f');w.appendChild(d2);
var pv=el('img');pv.alt='';var fi=el('input');fi.type='file';fi.accept='image/*';fi.hidden=true;
var up=el('button',null,'画像を変更');up.type='button';var rs=el('button',null,'既定に戻す');rs.type='button';
var hl=el('label','chk');var hc=el('input');hc.type='checkbox';hc.checked=!!V[k].hide;hl.appendChild(hc);hl.appendChild(document.createTextNode('非表示'));hl.style.margin='0';
var upd=function(){pv.src=V[k].d||(S.tpl==='waseda'?(k==='map'?'assets/map-fujisawa.png':'assets/logo-fujisawa.png'):'');pv.style.display=pv.src?'':'none'};
up.onclick=function(){fi.click()};
fi.onchange=function(){var fl=this.files[0];this.value='';if(!fl)return;resizeImage(fl,function(u){V[k].d=u;V[k].hide=false;hc.checked=false;save();upd();render()})};
rs.onclick=function(){V[k]={d:'',hide:false};hc.checked=false;save();upd();render()};
hc.onchange=function(){V[k].hide=hc.checked;save();render()};
d2.appendChild(pv);d2.appendChild(up);d2.appendChild(rs);d2.appendChild(hl);d2.appendChild(fi);upd();return}
var i;if(f.type==='textarea'||f.type==='lines'){i=el('textarea');i.rows=f.type==='lines'?6:2}
else{i=el('input');i.type=f.type==='date'?'date':f.type==='time'?'time':'text'}
i.value=V[k]||'';i.oninput=function(){V[k]=i.value;save();render()};w.appendChild(i)})}

/* ---------- デザイン選択・保存済み ---------- */
function drawTplSel(){var s=$('tpl');s.textContent='';TPL_ORDER.forEach(function(id){var o=el('option',null,TEMPLATES[id].name);o.value=id;s.appendChild(o)});s.value=S.tpl}
function drawPreSel(){var s=$('pre');s.textContent='';var o=el('option',null,'（保存済みを選択）');o.value='';s.appendChild(o);
presets.forEach(function(p){var op=el('option',null,p.name+'（'+TEMPLATES[p.tpl].name+'）');op.value=p.id;s.appendChild(op)});
if(!presets.some(function(p){return p.id===S.cur}))S.cur='';s.value=S.cur;
$('pover').disabled=$('pren').disabled=$('pdel').disabled=!S.cur}

$('psave').onclick=function(){var n=prompt('保存名を入力してください（例：第1回早大プレ）',S.cur&&byId(S.cur)?byId(S.cur).name:'');if(n==null)return;n=n.trim();if(!n)return;
var ex=presets.filter(function(p){return p.name===n})[0];
if(ex){if(!confirm('「'+n+'」は既に保存されています。上書きしますか？'))return;ex.tpl=S.tpl;ex.vals=clone(V);S.cur=ex.id}
else{var p={id:'p'+Date.now().toString(36),name:n,tpl:S.tpl,vals:clone(V)};presets.push(p);S.cur=p.id}
savePresets();save();drawPreSel()};
$('pover').onclick=function(){var p=byId(S.cur);if(!p)return;if(!confirm('「'+p.name+'」を現在の内容で上書きしますか？'))return;p.tpl=S.tpl;p.vals=clone(V);savePresets();drawPreSel()};

$('pdel').onclick=function(){var p=byId(S.cur);if(!p)return;if(!confirm('「'+p.name+'」を削除しますか？'))return;presets=presets.filter(function(x){return x!==p});S.cur='';savePresets();save();drawPreSel()};

/* ---------- 名簿 ---------- */
var headers=[],rows=[],map={},sel={};
SF_ORDER.forEach(function(k){map[k]=-1});
function parseDelim(text,delim){var out=[],row=[],f='',q=false,i=0,n=text.length,c;
for(;i<n;i++){c=text[i];
if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
else if(c==='"'&&f==='')q=true;
else if(c===delim){row.push(f);f=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}
else f+=c}
if(f!==''||row.length){row.push(f);out.push(row)}
return out}
function decode(buf){var t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('shift_jis').decode(buf)}
return t.replace(/^﻿/,'')}
function load(table){
table=table.map(function(r){return r.map(function(v){return v==null?'':String(v).trim()})}).filter(function(r){return r.some(function(v){return v!==''})});
if(table.length<2){alert('データ行が見つかりません（1行目は見出しにしてください）。');return false}
headers=table[0].map(function(h,i){return h||('列'+(i+1))});rows=table.slice(1);
map={};var norm=function(s){return s.toLowerCase().replace(/\s/g,'')};
SF_ORDER.forEach(function(k){map[k]=-1;
for(var i=0;i<headers.length;i++){if(SF[k][2].some(function(s){return norm(s)===norm(headers[i])})){map[k]=i;break}}});
if(map.name<0){var j=headers.findIndex(function(h){return /氏名|名前|name/i.test(h)&&!/カナ|かな|ふりがな|フリガナ/.test(h)});if(j>=0)map.name=j}
sel={};rows.forEach(function(_,i){sel[i]=true});
$('loaded').hidden=false;$('cnt').textContent=rows.length+'名読み込み';drawMap();drawList();render();return true}
function drawMap(){var m=$('map');m.textContent='';var used=tpl().studentFields;
used.forEach(function(k){m.appendChild(el('span',null,SF[k][0]));var s=el('select');
var o=el('option',null,'（使わない）');o.value=-1;s.appendChild(o);
headers.forEach(function(h,i){var op=el('option',null,h);op.value=i;s.appendChild(op)});
s.value=map[k];s.onchange=function(){map[k]=+s.value;$('auto').hidden=map.no>=0;drawList();render()};m.appendChild(s)});
$('auto').hidden=map.no>=0||used.indexOf('no')<0;}
function val(r,k){return map[k]>=0?(r[map[k]]||''):''}
function numOf(r,i){if(map.no>=0)return val(r,'no');
var d=Math.max(1,+$('adig').value||3);return $('apre').value+String((+$('astart').value||0)+i).padStart(d,'0')}
function drawList(){var l=$('list');l.textContent='';
rows.forEach(function(r,i){var lb=el('label');var c=el('input');c.type='checkbox';c.checked=!!sel[i];
c.onchange=function(){sel[i]=c.checked;render()};lb.appendChild(c);
lb.appendChild(document.createTextNode(numOf(r,i)+' '+(val(r,'name')||val(r,'kana')||'（氏名なし）')));l.appendChild(lb)});}
['apre','astart','adig'].forEach(function(id){$(id).oninput=function(){drawList();render()}});
$('sall').onclick=function(){rows.forEach(function(_,i){sel[i]=true});drawList();render()};
$('snone').onclick=function(){rows.forEach(function(_,i){sel[i]=false});drawList();render()};
function readFile(f){var ext=(f.name.split('.').pop()||'').toLowerCase();var fr=new FileReader();
fr.onerror=function(){alert('ファイルを読み込めませんでした。')};
fr.onload=function(){try{
if(ext==='csv'||ext==='txt'||ext==='tsv'){var t=decode(fr.result);var first=t.split(/\r?\n/)[0]||'';load(parseDelim(t,first.indexOf('\t')>=0&&first.indexOf(',')<0?'\t':','))}
else{if(!window.XLSX){alert('Excel読み込みライブラリを取得できませんでした（オンライン接続が必要です）。CSVをご利用ください。');return}
var wb=XLSX.read(fr.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];
load(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}))}
}catch(e){alert('読み込みエラー: '+e.message)}};
fr.readAsArrayBuffer(f)}
$('fbtn').onclick=function(){$('file').click()};
$('file').onchange=function(){if(this.files[0])readFile(this.files[0]);this.value=''};
var dz=$('drop');
['dragenter','dragover'].forEach(function(t){dz.addEventListener(t,function(e){e.preventDefault();dz.classList.add('over')})});
['dragleave','drop'].forEach(function(t){dz.addEventListener(t,function(e){e.preventDefault();dz.classList.remove('over')})});
dz.addEventListener('drop',function(e){var f=e.dataTransfer.files[0];if(f)readFile(f)});
